<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sacred Sutra — Open in app</title>
<meta name="description" content="Open Sacred Sutra on your device.">

<meta property="og:type" content="website">
<meta property="og:title" content="Sacred Sutra">
<meta property="og:description" content="Open in the Sacred Sutra app.">
<meta property="og:image" content="https://digish.github.io/project/sacredsutra.png">

<script async src="https://www.googletagmanager.com/gtag/js?id=G-05XHR9PJ95"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-05XHR9PJ95');
</script>

<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    background: linear-gradient(135deg, #8B4513 0%, #C45C26 50%, #D4A017 100%);
    text-align: center;
    color: #fff;
  }
  .container {
    background: rgba(255, 255, 255, 0.1);
    padding: 40px;
    border-radius: 20px;
    backdrop-filter: blur(10px);
    max-width: 320px;
    width: 90%;
  }
  .app-logo { width: 88px; height: 88px; border-radius: 22%; margin-bottom: 16px; }
  .loader {
    border: 3px solid rgba(255,255,255,0.3);
    border-top: 3px solid #fff;
    border-radius: 50%;
    width: 28px;
    height: 28px;
    animation: spin 1s linear infinite;
    margin: 0 auto 12px auto;
  }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  a { color: #fff; text-decoration: underline; font-weight: bold; }
</style>
</head>
<body>
  <div class="container">
    <img src="https://digish.github.io/project/sacredsutra.png" alt="Sacred Sutra" class="app-logo">
    <div class="loader" id="loader"></div>
    <h2 id="status">Opening Sacred Sutra…</h2>
    <p id="hint" style="font-size: 0.9rem; opacity: 0.9;">
      <a id="manual-link" href="https://digish.github.io/project/sacredsutra.html">Download the app</a>
    </p>
  </div>

  <script src="js/sacredsutra-deeplink.js"></script>
  <script>
    (function () {
      var q = SacredSutraDeeplink.parseQuery(window.location.search);
      var route = (q.route || q.r || '').trim().toLowerCase();
      if (!route && q.id) route = 'reading';

      var params = {};
      if (q.id) params.id = q.id;
      if (q.readingId) params.id = q.readingId;

      SacredSutraDeeplink.run({
        route: route,
        params: params,
        statusEl: document.getElementById('status'),
        hintEl: document.getElementById('hint'),
        loaderEl: document.getElementById('loader'),
        manualLinkEl: document.getElementById('manual-link'),
      });
    })();
  </script>
</body>
</html>
