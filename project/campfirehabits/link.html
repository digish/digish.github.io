<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campfire Habits — Join a circle</title>
<meta name="description" content="Join a Campfire Habits circle on your device.">

<meta property="og:type" content="website">
<meta property="og:title" content="Join my Campfire circle">
<meta property="og:description" content="Open in Campfire Habits to join friends and track habits together.">
<meta property="og:image" content="https://digish.github.io/project/campfirehabits.png">

<!-- Analytics: add GA4 id when ready -->
<!-- <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXX"></script> -->

<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    background: linear-gradient(160deg, #1a1625 0%, #0f0d14 45%, #2a1810 100%);
    text-align: center;
    color: #f5f0e8;
  }
  .container {
    background: rgba(255, 255, 255, 0.06);
    padding: 40px 28px;
    border-radius: 20px;
    backdrop-filter: blur(10px);
    max-width: 340px;
    width: 90%;
    border: 1px solid rgba(255, 140, 60, 0.2);
  }
  .app-logo { width: 88px; height: 88px; border-radius: 22%; margin-bottom: 16px; }
  .loader {
    border: 3px solid rgba(255,255,255,0.2);
    border-top: 3px solid #ff8c3a;
    border-radius: 50%;
    width: 28px;
    height: 28px;
    animation: spin 1s linear infinite;
    margin: 0 auto 12px auto;
  }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  a { color: #ffb07a; text-decoration: underline; font-weight: 600; }
  h2 { font-size: 1.25rem; margin: 8px 0; font-weight: 600; }
  p { font-size: 0.9rem; opacity: 0.9; line-height: 1.45; }
</style>
</head>
<body>
  <div class="container">
    <img src="https://digish.github.io/project/campfirehabits.png" alt="Campfire Habits" class="app-logo">
    <div class="loader" id="loader"></div>
    <h2 id="status">Joining circle…</h2>
    <p id="hint">
      <a id="manual-link" href="https://digish.github.io/project/campfirehabits.html">Get Campfire Habits</a>
    </p>
  </div>

  <script src="js/campfirehabits-deeplink.js"></script>
  <script>
    (function () {
      var q = CampfireHabitsDeeplink.parseQuery(window.location.search);
      CampfireHabitsDeeplink.runJoin({
        params: q,
        statusEl: document.getElementById('status'),
        hintEl: document.getElementById('hint'),
        loaderEl: document.getElementById('loader'),
        manualLinkEl: document.getElementById('manual-link'),
      });
    })();
  </script>
</body>
</html>
