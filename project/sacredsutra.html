        <h2 id="status">Opening App Store...</h2>
        <p style="font-size: 0.9rem; opacity: 0.9;">
            Not moving? <a id="manual-link" href="https://digish.github.io/project/sacredsutra/privacy-policy.html">Click here</a>.
        </p>

<script>
    (function() {
        // TODO: Replace iOS placeholder after App Store publish
        const IOS_URL = "REPLACE_WITH_APP_STORE_URL";
        const ANDROID_URL = "https://play.google.com/store/apps/details?id=org.komal.sacredsutra&pcampaignid=web_share";
        const FALLBACK_URL = "https://digish.github.io/project/sacredsutra/privacy-policy.html";

        const ua = navigator.userAgent || navigator.vendor || window.opera;
        let targetUrl = FALLBACK_URL;
        let platform = "Desktop";

        if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) {
            targetUrl = IOS_URL;
            platform = "iOS";
        } else if (/android/i.test(ua)) {
            targetUrl = ANDROID_URL;
            platform = "Android";
        }

        // Until store URLs are set, keep users on the fallback page
        if (targetUrl.indexOf("REPLACE_WITH_") === 0) {
            targetUrl = FALLBACK_URL;
        }

        document.getElementById('manual-link').href = targetUrl;
        document.getElementById('status').innerText = "Opening " + platform + " Store...";

        if (typeof gtag === 'function') {
            gtag('event', 'store_redirect', {
                'app_name': 'Sacred Sutra',
                'platform': platform,
                'target_url': targetUrl,
                'transport_type': 'beacon'
            });
        }

        setTimeout(function() {
            window.location.replace(targetUrl);
        }, 1500);
    })();
</script>
