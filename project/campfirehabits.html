<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campfire Habits - App Download</title>
<meta name="title" content="Campfire Habits - Download Now">
<meta name="description" content="Campfire Habits — build habits with consistency, not streak pressure. Quiet circles with friends on Google Drive.">

<meta property="og:type" content="website">
<meta property="og:url" content="https://digish.github.io/project/campfirehabits.html">
<meta property="og:title" content="Campfire Habits">
<meta property="og:description" content="Keep the fire burning. Download Campfire Habits for Android (iOS coming soon).">
<meta property="og:image" content="https://digish.github.io/project/campfirehabits.png">

<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    background: linear-gradient(160deg, #1a1625 0%, #0f0d14 45%, #2a1810 100%);
    text-align: center;
    color: #f5f0e8;
  }
  .container {
    background: rgba(255, 255, 255, 0.06);
    padding: 40px;
    border-radius: 20px;
    backdrop-filter: blur(10px);
    max-width: 320px;
    width: 90%;
    border: 1px solid rgba(255, 140, 60, 0.2);
  }
  .app-logo {
    width: 100px;
    height: 100px;
    border-radius: 22%;
    margin-bottom: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  }
  .loader {
    border: 3px solid rgba(255,255,255,0.2);
    border-top: 3px solid #ff8c3a;
    border-radius: 50%;
    width: 30px;
    height: 30px;
    animation: spin 1s linear infinite;
    margin: 0 auto 15px auto;
  }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  a { color: #ffb07a; text-decoration: underline; font-weight: bold; }
  h2 { font-size: 1.4rem; margin: 10px 0; }
</style>
</head>
<body>
  <div class="container">
    <img src="https://digish.github.io/project/campfirehabits.png" alt="Campfire Habits" class="app-logo">
    <div class="loader" id="loader"></div>
    <h2 id="status">Opening store…</h2>
    <p id="hint" style="font-size: 0.9rem; opacity: 0.9;">
      Not moving? <a id="manual-link" href="https://play.google.com/store/apps/details?id=com.campfirehabits.app">Google Play</a>
      or <a href="https://digish.github.io/project/campfirehabits/">learn more</a>.
    </p>
  </div>

<script>
(function() {
  const IOS_APP_ID = "";
  const IOS_URL = IOS_APP_ID ? "https://apps.apple.com/app/id" + IOS_APP_ID : "";
  const ANDROID_URL = "https://play.google.com/store/apps/details?id=com.campfirehabits.app&pcampaignid=web_share";
  const MARKETING_URL = "https://digish.github.io/project/campfirehabits/";

  const statusEl = document.getElementById('status');
  const hintEl = document.getElementById('hint');
  const loaderEl = document.getElementById('loader');
  const manualLink = document.getElementById('manual-link');

  const ua = navigator.userAgent || navigator.vendor || window.opera;
  let platform = "Desktop";

  if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) {
    platform = "iOS";
  } else if (/android/i.test(ua)) {
    platform = "Android";
  }

  function showIosSoon() {
    loaderEl.style.display = 'none';
    statusEl.innerText = 'iOS coming soon';
    hintEl.innerHTML = 'Android: <a href="' + ANDROID_URL + '">Google Play</a>. ' +
      '<a href="' + MARKETING_URL + '">About the app</a>.';
  }

  function redirectTo(url, label) {
    manualLink.href = url;
    statusEl.innerText = label;
    setTimeout(function() { window.location.replace(url); }, 1200);
  }

  if (platform === 'Android') {
    redirectTo(ANDROID_URL, 'Opening Google Play…');
    return;
  }
  if (platform === 'iOS') {
    if (IOS_URL) {
      redirectTo(IOS_URL, 'Opening App Store…');
    } else {
      showIosSoon();
    }
    return;
  }
  redirectTo(MARKETING_URL, 'Learn about Campfire Habits…');
})();
</script>
</body>
</html>
